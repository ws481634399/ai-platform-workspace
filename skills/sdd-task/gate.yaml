# OpenSpec SDD Gate 配置（Phase 4.4：DU 下沉实现仓）
# 见 phase-1.5-workflow-engine-design.md §11 / requirement-story-du-rearchitecture spec

stage: task
# Phase 4.4：task 阶段外部唯一锚点产物 = test-design.md（Story 级）。
# 任务/技术产物（task-design.md / task-spec.md）只存在于实现仓 DU 目录，
# 由 du-task-files 跨仓聚合机检；tasks.md 已废弃。
artifact: test-design.md

# Phase 4.1 轻量化：advisory fail 只记 warning 不阻断；skip-tier 命中 evidence-tier 时跳过
machine-checks:
  - no-placeholder
  - required-sections
  - { id: cross-reference-valid, severity: advisory } # 引用缺失/误报只警告不卡流程
  - { id: tc-coverage, skip-tier: [light] } # Phase 4.3 S4：每个 AC-NNN 至少被一个 TC-NNN verified-by（追踪链仪式检查，light 档跳过）
  - { id: du-coverage, skip-tier: [light] } # DU 划分表声明完整性（repository 注册/AC/depends）
  - { id: du-task-files, skip-tier: [light] } # Phase 4.4：各实现仓 task-design.md/task-spec.md 齐备且填写完整
  - { id: du-source-of-truth, skip-tier: [light] } # Phase 4.4：仓内 DU 实体 ⊆ design DU 划分表（越界建目录 blocking）

required-front-matter: []

required-replacements:
  - change-id
  - feature-path

non-empty-ai-sections:
  - "## 1. 测试用例"

human-checks:
  - "## 2. 测试策略"

# Phase 4.2 三级规格分层：3-tier 多 Story 时 test-design.md 逐 Story 生成
#（stories/<id>/test-design.md），workflow 传 storyId 激活 story mode；
# DU 相关检查自动限定该 Story 的四级路径与实现仓实体集合。
three-tier:
  story-artifact: test-design.md
  story-machine-checks:
    - { id: scope-subset, target: du } # 仓内 DU Scope [S<n>] ⊆ Story scope-refs（无引用条目仅 warning）
    - { id: du-source-of-truth, skip-tier: [light] } # 仓内实体 ⊆ story-design DU 表
