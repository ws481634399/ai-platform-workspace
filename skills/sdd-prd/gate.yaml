# OpenSpec SDD Gate 配置（Phase 1.5）
# 见 phase-1.5-workflow-engine-design.md §11
# Phase 4.4：需求级产物统一为 requirement-spec.md（原 spec.md / change-spec.md 收敛），单/多 Story 一份

stage: prd
artifact: requirement-spec.md

# Phase 4.1 轻量化：advisory fail 只记 warning 不阻断；skip-tier 命中 evidence-tier 时跳过
machine-checks:
  - required-front-matter
  - no-placeholder
  - required-sections
  - { id: cross-reference-valid, severity: advisory } # 引用缺失/误报只警告不卡流程

required-front-matter: []

required-replacements:
  - change-id
  - requirement
  - target-user
  - pain-points
  - expected-value
  - scope-in
  - scope-out

non-empty-ai-sections:
  - "## 1. 背景"
  - "## 2. 用户价值"
  - "## 5. 全局验收标准"
  - "## 7. 成功指标" # 业界标配 Success Metrics（可写"本期不度量"）

human-checks:
  - "## 1. 背景"
  - "## 2. 用户价值"
  - "## 5. 全局验收标准"
  - "## 7. 成功指标"

# Phase 4.2 三级规格分层（plans/phase-4.2-three-tier-spec-design.md §5/§8）
# Phase 4.4 起 Change 级与 stage 级同指 requirement-spec.md（多 Story 时 change3 模式走本段配置）；
# Story 级（workflow 传 storyId）检查各 Story 目录的 story-spec.md。
three-tier:
  change-artifact: requirement-spec.md
  change-non-empty-ai-sections:
    - "## 1. 背景"
    - "## 2. 用户价值"
    - "## 3. 功能范围"
    - "## 5. 全局验收标准"
    - "## 7. 成功指标" # 业界标配 Success Metrics（可写"本期不度量"）
  change-required-replacements:
    - change-id
    - requirement
    - target-user
    - pain-points
    - expected-value
    - scope-in
    - scope-out
  story-artifact: story-spec.md
  story-machine-checks:
    - { id: change-ref-bound, field: change-spec-ref } # Story→Requirement spec 章节引用（blocking，评审决策：Story 级从 advisory 升 blocking）
    - { id: scope-subset, target: change } # Story Scope ⊆ Requirement Scope（[S<n>] 编号引用，blocking）
  story-non-empty-ai-sections:
    - "## 1. Story 目标"
    - "## 2. Scope（范围）"
    - "## 5. Story 验收标准"
  story-required-replacements:
    - change-id
    - story-id
    - change-spec-ref
    - scope-in
    - scope-out
