# OpenSpec Story Metadata
#
# 版本: v1（Phase 4.2 Three-Tier Spec Delivery）
# 类型: Story 级生命周期 + Gate 载体
#
# 由 story-model.js.createStory() 或 change split-story 命令生成。
# Story 必绑定单个 Feature 链（feature-path 不可空）；status/DU 状态由 Workflow Engine
# 通过 StoryPatch 函数改写（Document API 保留注释）。

schema-version: 1 # Story 元信息 schema 版本

change-id: "CHG-0018" # 所属 Change ID（CHG-XXXX）
story-id: "STORY-003-03-01-01" # Story ID（对齐 product/feature-tree.yaml）
title: "购物车核心操作" # Story 标题
summary: "纯 Redis 会员购物车核心操作与实时校验、游客 LocalStorage 购物车登录后幂等合并、memberId 取自 SecurityContext" # Story 一句话摘要（可选）
status: pending # Story 生命周期：pending/specified/designed/tasked/developing/testing/completed
evidence-tier: standard # 继承 Change 级或覆盖：light/standard/strict（light 免仪式检查但 structural 检查仍执行）
created-at: "2026-09-14T14:11:45.023Z" # ISO8601，创建时填
updated-at: "2026-09-14T14:11:45.023Z" # ISO8601，每次变更更新

# 交叉引用（字段名为兼容旧 schema 保留，值必须指向 Requirement 级产物的具体章节）
change-spec-ref: "" # 例：requirement-spec.md#32-story-1-功能范围
change-design-ref: "" # 例：requirement-design.md#41-story-1-模块改造

# Feature 四级链（Story 级权威绑定；与 Change 级 feature-path 不同——Story 必非空）
feature-path:
  level-1:
    id: FEAT-003
    name: 商城前台
  level-2:
    id: FEAT-003-03
    name: 购物车
  level-3:
    id: FEAT-003-03-01
    name: 会员购物车
  story:
    id: STORY-003-03-01-01
    name: 购物车核心操作
  candidate: false

# 交付单元列表（Story 1:N DU；task 阶段由 sdd-task 写入，status 由 delivery-unit 纯函数同步）
dus: []

# Story 级 Gate Result（与 Change 级 artifacts 独立；GateRepository 分发写入）
# 每个 artifact 节点结构同 Change metadata.artifacts.*：
#   story-spec / story-design / tasks / implementation / test-report / review-report
# Machine Gate 记录含 rules-hash（gate.yaml 规则指纹，规则变化触发 rules-mismatch stale）
artifacts:
  story-spec:
    path: story-spec.md
    gates:
      machine:
        status: passed
        checked-at: 2026-09-14T14:55:59.115Z
        validator: sdd-prd
        artifact-hash: sha256:75f82dd59805e4287128ca33cc8d1b662fb6b50bca7c441a88beb5a18363cf5e
        rules-hash: sha256:f2f16113565f781d95040d45bd9821bb67a7072bf7b211446e9e21a6b0d5d905
        issues: []
        warnings: []
      human:
        status: approved
        reviewed-at: 2026-09-14T14:55:59.328Z
        reviewer: trae-agent
        artifact-hash: sha256:75f82dd59805e4287128ca33cc8d1b662fb6b50bca7c441a88beb5a18363cf5e
        reason: ""
