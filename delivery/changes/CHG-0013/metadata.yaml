    evidence-tier: standard

# Phase 2.4 保留：仓库 Baseline / Result（DU 物化与完成时由 delivery-unit.js 写入）
# repository-baseline：DU materialize 时记录各仓起始 commit（可由 du sync-status 刷新）
# repository-result：DU completed 时记录各仓结果 commit
# 与 Submodule Pointer 的一致性由 converge 阶段 submodule-pointer-aligned 机检
repository-baseline:
  {}
  # backend: { commit: abc111 }
repository-result:
  {}
  # backend: { commit: abc999 }

# Phase 1.5 保留：artifacts 段（Gate Result 持久化）
# v3 语义：仅存储 **Change 级** 产物 Gate（exploration / change-spec / change-design / convergence）。
# Story 级产物（story-spec / story-design / tasks / implementation / ...）Gate 存储在
# stories/<id>/story-metadata.yaml.artifacts（inline 模式仍存在此处，双语义合并）。
# GateRepository 用 setIn 按需创建（不预填，避免模板臃肿）。
# Machine Gate 记录字段：status / checked-at / validator / artifact-hash / rules-hash / issues / warnings
#   artifact-hash：产物内容 SHA-256，产物变化 → hash 变化 → 旧 Gate 失效
#   rules-hash：gate.yaml 规则内容 SHA-256，规则变化 → hash 变化 → detectStaleArtifacts 报 rules-mismatch
artifacts:
  exploration:
    path: exploration.md
    gates:
      machine:
        status: passed
        checked-at: 2026-09-13T03:19:07.428Z
        validator: sdd-explore
        artifact-hash: sha256:2386657aefbe9472697223da4c132689d8175027fb00ff1b8f5fa2e62544534d
        rules-hash: sha256:4194b2a551e45101d209ff7daac11103cf0fcc9c2caeef61de163b3077f8825d
        issues: []
        warnings: []
      human:
        status: skipped
        reviewed-at: 2026-09-13T03:19:07.439Z
        reviewer: workflow
        artifact-hash: sha256:2386657aefbe9472697223da4c132689d8175027fb00ff1b8f5fa2e62544534d
        reason: "human-gate: skip (explore)"
