# OpenSpec Change Metadata
#
# 版本: v4（Phase 4.3 Traceability：spec 改名 + stories[].domain）
# 类型: Change Metadata（SDD 生命周期载体元信息）
#
# 由 ChangeModel.runChangeCreate 生成（sdd-explore 内部调用）。
# v2 增量：schema-version / feature-path / repository-baseline / repository-result
# v3 增量：stories 列表（Change 1:N Story 权威索引）
# v4 增量：prd.md→spec.md / change-prd.md→change-spec.md 改名；stories[].domain 领域归属（inline 自动继承 L3）
# 兼容规则：schema-version 缺失 = v1；= 2 旧格式（CHG↔Story 1:1 平铺）；= 3 三级规格（含 stories）；= 4 本格式
#          旧 Change 仅在被显式操作（bind-feature-path / split-story / upgrade）时升 v4
# 后续 status/archive 由 Document API 改写（保留注释）。

schema-version: 5 # 1=v1(仅 features 扁平表)；2=v2(Phase 2.4-4.1，单 Story 平铺)；3=v3(1:N Stories)；4=v4(本格式，spec 命名+domain)

id: "CHG-0013" # CHG-XXXX，创建时填
title: "库存核心能力" # 简短标题
summary: "SKU 库存初始化/查询/调整/锁定/释放/确认扣减，幂等与并发防护，库存流水" # 一句话摘要（可选）
status: exploring # 见 Lifecycle State（change-lifecycle.md §4）：created/exploring/specified/designed/story-splitting/tasked/developing/testing/completed/archived
requirement: "REQ-M2-004" # 需求来源 REQ-XXX（sdd-explore 记录，对齐 requirement.md front-matter.id）
created-at: "2026-09-13T02:37:55.533Z" # ISO8601，创建时填
updated-at: "2026-09-13T03:31:56.932Z" # ISO8601，每次状态变更更新
features:
  - FEAT-002
  - FEAT-002-04
  - FEAT-002-04-01
  - STORY-002-04-01-01
  - FEAT-002-04-02
  - STORY-002-04-02-01
  - FEAT-002-04-03
  - STORY-002-04-03-01
  - FEAT-002-04-04
  - STORY-002-04-04-01
repositories:
  # 影响的仓库 id 列表（对应 .sdd/repositories.yaml，可空）
  # - backend
related-change: "" # 关联的历史 CHG-XXXX（需求复用 archived Change 时记录，可空）

# Phase 4.1 轻量化：Evidence 分档（gate-validator 按档位跳过 skip-tier 命中的 machine-checks）
# light    — 单仓、无接口变更的小改动：免除仪式性检查（多仓协调/物化跟踪/逐 commit 映射），
#            但结构完整性检查（追踪链/骨架/收口，标 structural:true）仍全量执行
# standard — 缺省档，完整 Evidence（不改此字段即 standard）
# strict   — 跨仓/核心链路/安全变更：完整 Evidence + 全量机检
evidence-tier: standard

# Phase 4.2 新增：stories 列表（Change 1:N Story 权威索引）
# - 单 Story inline 模式：长度 = 1 且 inline=true（CHG 根目录同时是 Story 目录）
# - 多 Story 三级模式：每条路径指向 stories/<STORY-ID>/ 目录，其中含 story-metadata.yaml
stories:
  - id: STORY-002-04-01-01
    title: 库存初始化与查询
    inline: false
    status: pending
    path: 商品与库存/库存核心能力/库存基础/库存初始化与查询/
    domain:
      id: FEAT-002-04-01
      name: 库存基础
    evidence-tier: standard
  - id: STORY-002-04-02-01
    title: 库存调整与流水
    inline: false
    status: pending
    path: 商品与库存/库存核心能力/库存调整/库存调整与流水/
    domain:
      id: FEAT-002-04-02
      name: 库存调整
    evidence-tier: standard
  - id: STORY-002-04-03-01
    title: 库存锁定与释放
    inline: false
    status: pending
    path: 商品与库存/库存核心能力/库存预留/库存锁定与释放/
    domain:
      id: FEAT-002-04-03
      name: 库存预留
    evidence-tier: standard
  - id: STORY-002-04-04-01
    title: 库存确认扣减
    inline: false
    status: pending
    path: 商品与库存/库存核心能力/库存确认/库存确认扣减/
    domain:
