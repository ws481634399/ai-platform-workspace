# OpenSpec Story Metadata
#
# 版本: v1（Phase 4.2 Three-Tier Spec Delivery）
# 类型: Story 级生命周期 + Gate 载体
#
# 由 story-model.js.createStory() 或 change split-story 命令生成。
# Story 必绑定单个 Feature 链（feature-path 不可空）；status/DU 状态由 Workflow Engine
# 通过 StoryPatch 函数改写（Document API 保留注释）。

schema-version: 1 # Story 元信息 schema 版本

change-id: "CHG-0007" # 所属 Change ID（CHG-XXXX）
story-id: "STORY-001-01-04-01" # Story ID（对齐 product/feature-tree.yaml）
title: "接入管理端基础登录流程" # Story 标题
summary: "mall-admin 提供登录页面、认证请求与基础 Token 登录态" # Story 一句话摘要（可选）
status: testing # Story 生命周期：pending/specified/designed/tasked/developing/testing/completed
evidence-tier: light # 继承 Change 级或覆盖：light/standard/strict（light 免仪式检查但 structural 检查仍执行）
created-at: "2026-09-11T13:27:32.151Z" # ISO8601，创建时填
updated-at: "2026-09-12T03:35:00Z" # dev evidence generated

# 交叉引用（Gate cross-reference blocking 检查：必须指向 change-spec.md / change-design.md 具体章节）
change-spec-ref: "change-spec.md#33-story-拆分总表" # 例：change-spec.md#32-story-1-功能范围
change-design-ref: "change-design.md#5-story-设计分派story-design-assignments" # 例：change-design.md#41-story-1-模块改造

# Feature 四级链（Story 级权威绑定；与 Change 级 feature-path 不同——Story 必非空）
feature-path:
  level-1:
    id: FEAT-001
    name: 身份与权限
  level-2:
    id: FEAT-001-01
    name: 统一身份认证体系
  level-3:
    id: FEAT-001-01-04
    name: 管理端认证入口
  story:
    id: STORY-001-01-04-01
    name: 接入管理端基础登录流程
  candidate: false

# 交付单元列表（Story 1:N DU；task 阶段由 sdd-task 写入，status 由 delivery-unit 纯函数同步）
dus:
  - id: DU-FE-101
    repository: repo-2
    status: completed

