# OpenSpec Story Metadata
#
# 版本: v1（Phase 4.2 Three-Tier Spec Delivery）
# 类型: Story 级生命周期 + Gate 载体
#
# 由 story-model.js.createStory() 或 change split-story 命令生成。
# Story 必绑定单个 Feature 链（feature-path 不可空）；status/DU 状态由 Workflow Engine
# 通过 StoryPatch 函数改写（Document API 保留注释）。

schema-version: 1 # Story 元信息 schema 版本

change-id: "CHG-0025" # 所属 Change ID（CHG-XXXX）
story-id: "STORY-009-01-01" # Story ID（对齐 product/feature-tree.yaml）
title: "RocketMQ 事件基础设施" # Story 标题
summary: "" # Story 一句话摘要（可选）
status: developing # Story 生命周期：pending/specified/designed/tasked/developing/testing/completed
evidence-tier: standard # 继承 Change 级或覆盖：light/standard/strict（light 免仪式检查但 structural 检查仍执行）
created-at: "2026-09-22T13:24:12.279Z" # ISO8601，创建时填
updated-at: "2026-09-23T14:47:49.010Z" # ISO8601，每次变更更新

# 交叉引用（字段名为兼容旧 schema 保留，值必须指向 Requirement 级产物的具体章节）
change-spec-ref: "requirement-spec.md#3-功能范围" # 例：requirement-spec.md#32-story-1-功能范围
change-design-ref: "requirement-design.md#5-story-设计分派story-design-assignments" # 例：requirement-design.md#41-story-1-模块改造

# Feature 四级链（Story 级权威绑定；与 Change 级 feature-path 不同——Story 必非空）
feature-path:
  level-1:
    id: FEAT-009
    name: 分布式增强
  level-2:
    id: FEAT-009-01
    name: RocketMQ 事件基础设施
  level-3:
    id: FEAT-009-01-01
    name: 事件基础能力
  story:
    id: STORY-009-01-01
    name: RocketMQ 事件基础设施
  candidate: false

# 交付单元列表（Story 1:N DU；task 阶段由 sdd-task 写入，status 由 delivery-unit 纯函数同步）
dus: []

