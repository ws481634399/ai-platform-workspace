  # ---- sdd-review 阶段：review-finding（4 项；2 major 已闭环，2 minor 同步修复）----
  - id: EV-011
    type: review-finding
    target: RocketMQAutoConfiguration.java:integrationListenerRegistrar
    severity: major
    finding: 消费者在 SmartInitializingSingleton lambda 内手动 start，并用 Runtime.addShutdownHook 兜底——脱离 Spring 生命周期；上下文关闭但 JVM 不退出（上下文重建/测试/devtools）时消费线程不释放，hook 随上下文累积泄漏。违反 framework-standard §2.2「避免破坏框架生命周期」。
    resolution: 已改为 Spring 管理的 SmartLifecycle Bean（start 扫描建消费者、stop 统一 shutdown），移除 JVM hook，见 EV-015；回归 32/32 见 EV-018。
    recorded-at: 2026-09-23T23:10:00+08:00

  - id: EV-012
    type: review-finding
    target: implementation.md#Deviations
    severity: major
    finding: requirement-design §2.1 模块树声明 mall-common/mall-mq，实际落位 mall-common/mall-common-mq；对齐兄弟模块命名但未在 Deviations 记录（未记录偏离 = major）。
    resolution: 已补记 DU implementation.md DEV-6（命名归一化三要素+影响评估），见 EV-017。
    recorded-at: 2026-09-23T23:10:00+08:00

  - id: EV-013
    type: review-finding
    target: ConsumedEventRepository.java:<init>
    severity: minor
    finding: tableName 直接拼接进 SQL（配置来源、非用户输入，风险低）；database-access-standard §9.1 禁止拼接 SQL。
    resolution: 构造时按 SQL 标识符白名单 ^[a-zA-Z_][a-zA-Z0-9_]{0,63}$ 校验，非法表名拒绝装配，见 EV-015（含 ConsumedEventRepositoryTest 新增用例）。
    recorded-at: 2026-09-23T23:10:00+08:00

  - id: EV-014
    type: review-finding
    target: AbstractIntegrationHandler.java:processMessage
    severity: minor
    finding: 注释「不删占位？不——」为自问式草稿表达，不符合 coding-standards 注释规则（简洁陈述 WHY）。
    resolution: 已改为陈述式注释（解析失败未建占位直接重试），见 EV-015。
    recorded-at: 2026-09-23T23:10:00+08:00

