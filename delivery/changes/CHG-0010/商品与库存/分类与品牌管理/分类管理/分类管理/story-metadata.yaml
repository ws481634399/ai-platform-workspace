# OpenSpec Story Metadata
#
# 版本: v1（Phase 4.2 Three-Tier Spec Delivery）
# 类型: Story 级生命周期 + Gate 载体
#
# 由 story-model.js.createStory() 或 change split-story 命令生成。
# Story 必绑定单个 Feature 链（feature-path 不可空）；status/DU 状态由 Workflow Engine
# 通过 StoryPatch 函数改写（Document API 保留注释）。

schema-version: 1 # Story 元信息 schema 版本

change-id: "CHG-0010" # 所属 Change ID（CHG-XXXX）
story-id: "STORY-002-01-01-01" # Story ID（对齐 product/feature-tree.yaml）
title: "分类管理" # Story 标题
summary: "建立商品分类树与品牌基础数据管理，支持后台启停与商品合法性校验" # Story 一句话摘要（可选）
status: completed # Story 生命周期：pending/specified/designed/tasked/developing/testing/completed
evidence-tier: standard # 继承 Change 级或覆盖：light/standard/strict（light 免仪式检查但 structural 检查仍执行）
created-at: "2026-09-13T03:31:56.718Z" # ISO8601，创建时填
updated-at: "2026-09-13T07:15:58.090Z" # ISO8601，每次变更更新

# 交叉引用（Gate cross-reference blocking 检查：必须指向 change-spec.md / change-design.md 具体章节）
change-spec-ref: "" # 例：change-spec.md#32-story-1-功能范围
change-design-ref: "" # 例：change-design.md#41-story-1-模块改造

# Feature 四级链（Story 级权威绑定；与 Change 级 feature-path 不同——Story 必非空）
feature-path:
  level-1:
    id: FEAT-002
    name: 商品与库存
  level-2:
    id: FEAT-002-01
    name: 分类与品牌管理
  level-3:
    id: FEAT-002-01-01
    name: 分类管理
  story:
    id: STORY-002-01-01-01
    name: 分类管理
  candidate: false

# 交付单元列表（Story 1:N DU；task 阶段由 sdd-task 写入，status 由 delivery-unit 纯函数同步）
dus: []

