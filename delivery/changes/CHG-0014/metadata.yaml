# OpenSpec Change Metadata
#
# 版本: v5（Requirement → 1..N Stories 统一模型）
# 类型: Change Metadata（SDD 生命周期载体元信息）
#
# 由 ChangeModel.runChangeCreate 生成（sdd-explore 内部调用）。
# v2 增量：schema-version / feature-path / repository-baseline / repository-result
# v3 增量：stories 列表（Change 1:N Story 权威索引）
# v4 历史增量：旧产物改名与 stories[].domain 领域归属
# 兼容规则：schema-version 缺失 = v1；2–4 由 upgrade 迁移；v5 起 Story 始终为 1..N 普通子实体
#          旧 Change 通过 upgrade 迁移到 v5
# 后续 status/archive 由 Document API 改写（保留注释）。

schema-version: 5 # v5=Requirement → 1..N Stories 统一模型（无 inline 分支）

id: "CHG-0014" # CHG-XXXX，创建时填
title: "M0-M2 验收缺口补全" # 简短标题
summary: "补齐商品图片属性与原子 SKU 创建、商品 API 网关路由、库存内部接口鉴权及 M1 前端质量回归；手机端和 M3 mall-web 页面不在本次范围。" # 一句话摘要（可选）
status: testing # 见 Lifecycle State（change-lifecycle.md §4）：created/exploring/specified/designed/story-splitting/tasked/developing/testing/completed/archived
requirement: "REQ-M1-QUALITY,REQ-M2-002,REQ-M2-003,REQ-M2-004" # 需求来源 REQ-XXX（sdd-explore 记录，对齐 requirement.md front-matter.id）
created-at: "2026-09-13T15:29:38.662Z" # ISO8601，创建时填
updated-at: "2026-09-14T00:40:33.654Z" # ISO8601，每次状态变更更新
features:
  - FEAT-002
  - FEAT-002-02
  - FEAT-002-02-01
  - STORY-002-02-01-01
repositories:
  # 影响的仓库 id 列表（对应 .sdd/repositories.yaml，可空）
  # - backend
related-change: "" # 关联的历史 CHG-XXXX（需求复用 archived Change 时记录，可空）

# Phase 4.1 轻量化：Evidence 分档（gate-validator 按档位跳过 skip-tier 命中的 machine-checks）
# light    — 单仓、无接口变更的小改动：免除仪式性检查（多仓协调/物化跟踪/逐 commit 映射），
#            但结构完整性检查（追踪链/骨架/收口，标 structural:true）仍全量执行
# standard — 缺省档，完整 Evidence（不改此字段即 standard）
# strict   — 跨仓/核心链路/安全变更：完整 Evidence + 全量机检
evidence-tier: standard

# Workflow Profile：full=逐阶段 Gate；fast=plan/dev/check 三个宏 Gate。Artifact 格式完全相同。
workflow-profile: fast
workflow-phase: check # fast 时为 plan/dev/check/completed；full 时为 null
workflow-switch-history:
  - from: full
    to: fast
    at: 2026-09-13T15:33:58.528Z
    actor: user
workflow-gates:
  fast:
    plan:
      status: pending
      issues:
        - "聚合规则（§5.3）：等待 Story 完成: STORY-002-02-01-01。用 'openspec workflow run
          <wf> --change CHG-0014 --story <STORY-ID>' 逐 Story 推进。"
      checkedAt: 2026-09-13T15:47:42.569Z
    dev:
      status: failed
      issues:
        - "Story STORY-002-02-01-01 machine gate failed: implementation.md: 缺少必需
          section: ## 2. Commit 记录; implementation.md: repos-coverage:
          implementation.md 的 commit cd45af4 缺少 code-change Evidence 条目;
          implementation.md: repos-coverage: implementation.md 的 commit 71d7bef
          缺少 code-change Evidence 条目"
      checkedAt: 2026-09-14T00:34:57.496Z
    check:
      status: failed
      issues:
        - "Machine gate failed: convergence.md: 前序 artifact 未 accepted:
          test-design.md (status: draft); convergence.md: 前序 artifact 未
          accepted: implementation.md (status: draft); convergence.md: 前序
          artifact 未 accepted: evidence/test-report.md (status: draft);
          convergence.md: 前序 artifact 未 accepted: review-report.md (status:
          draft); convergence.md: 存在 DU 但 metadata.repository-result 为空（DU
          completed 时应回填 result commit）"
      checkedAt: 2026-09-14T00:48:29.057Z

# Phase 2.4 保留：feature-path（完整四级链）
# 兼容索引：首次绑定 Story 时可保留；权威 Story 链始终位于 story-metadata.yaml。
# candidate: explore 产出 Candidate 且未晋升时为 true（此时无法进入 task 阶段）
feature-path:
  level-1:
    id: FEAT-002
    name: 商品与库存
  level-2:
    id: FEAT-002-02
    name: 商品与 SKU 管理
  level-3:
    id: FEAT-002-02-01
    name: 商品主数据
  story:
    id: STORY-002-02-01-01
    name: 商品 SPU 管理
  candidate: false

# stories 是 Requirement 的 Story 权威索引；设计完成后长度必须为 1..N。
# 每个 Story 都有独立目录与 story-metadata.yaml。
stories:
  - id: STORY-002-02-01-01
    title: 商品 SPU 管理
    status: pending
    path: 商品与库存/商品与 SKU 管理/商品主数据/商品 SPU 管理/
    domain:
      id: FEAT-002-02-01
      name: 商品主数据
    evidence-tier: standard

# Phase 2.4 保留：仓库 Baseline / Result（DU 物化与完成时由 delivery-unit.js 写入）
# repository-baseline：DU materialize 时记录各仓起始 commit（可由 du sync-status 刷新）
# repository-result：DU completed 时记录各仓结果 commit
# 与 Submodule Pointer 的一致性由 converge 阶段 submodule-pointer-aligned 机检
repository-baseline:
  {}
  # backend: { commit: abc111 }
repository-result:
  {}
  # backend: { commit: abc999 }

