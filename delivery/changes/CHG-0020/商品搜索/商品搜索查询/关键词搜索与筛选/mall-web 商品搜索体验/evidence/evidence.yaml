  - id: EV-003
    type: review-finding
    target: src/views/search/SearchView.vue；联动首页/布局入口；Story AC-002、Change AC-015
    severity: major
    finding: 结果页只有关键词/价格/排序/分页控件，无分类下拉与品牌 ID 输入；HomeView 分类卡、商品详情面包屑均跳 /products?categoryId=，全站无携带 categoryId/brandId 进入 /search 的入口——用户无法在 UI 上操作分类/品牌筛选（URL 直拼与后端能力本身可用），AC-015 与本 Story AC-002 未完整满足，且 DU-FE-501 Deviations 未记录该偏差
    resolution: "已闭环：5ab0979 在 SearchView 新增分类树选择与品牌下拉筛选（经 buildRouterQuery 写 URL 并重置 page=1），并新增 SearchView.spec 3 例（筛选渲染/URL 同步/雪花 ID 详情跳转）；本文件 EV-009 登记提交、EV-010 mall-web 全量 105 例回归全绿；浏览器全链路操作仍随 Integration Gate 联测（EV-006）"
    recorded-at: "2026-09-19T03:10:00+08:00"
  - id: EV-004
    type: review-finding
    target: src/api/search.ts（ProductSearchItem.productId、ProductSearchQuery 注释）；联动 SearchView onCardClick
    severity: major
    finding: productId 声明为 number，违反 api-design-standard §5.3"前端 API 层 ID 必须 string、禁止 Number(id)"，且与 catalog.ts 全量 string 及后端 mall-product 公开 DTO @StringId 口径不一致；后端原 number 直出，真实雪花 ID 会末位丢失并导致详情跳错
    resolution: "已闭环：随后端 d7dc2b0 @StringId 修复（STORY-005-01-02-01 EV-003），5ab0979 将 productId/categoryId/brandId 改 string，路由插值与 query 传参兼容，search.spec.ts 类型断言同步；本文件 EV-009 登记提交、EV-010 全量 105 例回归全绿（后端回归见 Change EV-016/EV-018）"
    recorded-at: "2026-09-19T03:10:00+08:00"
