    resolution: "处置去向：视图部分已由 5ab0979 新增 SearchView.spec 3 例闭环（筛选渲染/URL 同步/雪花 ID 详情跳转，见 EV-009/EV-010）；store 三态/requestSeq 竞态纯单测仍缺，待补 stores/search.spec.ts 或以 Integration Gate 浏览器联测闭合，技术债允许开放"
