    finding: productId 以裸 Long number 直出，违反 api-design-standard §5.3 业务 ID 字符串化强制要求，且与 mall-product 全部公开 DTO 使用 @StringId、mall-web catalog.ts 全部 id:string 的既有口径不一致；真实雪花 ID（超 2^53）在前端解析末位丢失，点搜索结果卡片可能进入错误详情页
    resolution: "已闭环：d7dc2b0 为 ProductSearchItem.productId 加 common-web @StringId（入参仍保持 Long），前端 5ab0979 联动将 productId 等 ID 改 string；本文件 EV-006 登记修复提交、EV-007 定向回归 26 例全绿（Change 级 EV-016~EV-019，含 mall-web 105 例）"
