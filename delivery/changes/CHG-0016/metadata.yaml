# OpenSpec Change Metadata
#
# 版本: v5（Requirement → 1..N Stories 统一模型）
# 类型: Change Metadata（SDD 生命周期载体元信息）
#
# 由 ChangeModel.runChangeCreate 生成（sdd-explore 内部调用）。
# v2 增量：schema-version / feature-path / repository-baseline / repository-result
# v3 增量：stories 列表（Change 1:N Story 权威索引）
# v4 历史增量：旧产物改名与 stories[].domain 领域归属
# 兼容规则：schema-version 缺失 = v1；2–4 由 upgrade 迁移；v5 起 Story 始终为 1..N 普通子实体
#          旧 Change 通过 upgrade 迁移到 v5
# 后续 status/archive 由 Document API 改写（保留注释）。

schema-version: 5 # v5=Requirement → 1..N Stories 统一模型（无 inline 分支）

id: "CHG-0016" # CHG-XXXX，创建时填
title: "商城会员与地址" # 简短标题
summary: "MEMBER 用户名密码注册登录与会话隔离、事件幂等初始化 Profile、会员资料与头像、收货地址 CRUD 与资源归属校验" # 一句话摘要（可选）
status: story-splitting # 见 Lifecycle State（change-lifecycle.md §4）：created/exploring/specified/designed/story-splitting/tasked/developing/testing/completed/archived
requirement: "REQ-M3-001" # 需求来源 REQ-XXX（sdd-explore 记录，对齐 requirement.md front-matter.id）
created-at: "2026-09-14T14:02:05.217Z" # ISO8601，创建时填
updated-at: "2026-09-14T15:24:38.166Z" # ISO8601，每次状态变更更新
features:
  - FEAT-003
  - FEAT-003-01
  - FEAT-003-01-01
  - STORY-003-01-01-01
repositories:
  # 影响的仓库 id 列表（对应 .sdd/repositories.yaml，可空）
  # - backend
related-change: "" # 关联的历史 CHG-XXXX（需求复用 archived Change 时记录，可空）

# Phase 4.1 轻量化：Evidence 分档（gate-validator 按档位跳过 skip-tier 命中的 machine-checks）
# light    — 单仓、无接口变更的小改动：免除仪式性检查（多仓协调/物化跟踪/逐 commit 映射），
#            但结构完整性检查（追踪链/骨架/收口，标 structural:true）仍全量执行
# standard — 缺省档，完整 Evidence（不改此字段即 standard）
# strict   — 跨仓/核心链路/安全变更：完整 Evidence + 全量机检
evidence-tier: standard

# Workflow Profile：full=逐阶段 Gate；fast=plan/dev/check 三个宏 Gate。Artifact 格式完全相同。
workflow-profile: full
workflow-phase: null # fast 时为 plan/dev/check/completed；full 时为 null
workflow-switch-history: [] # { from, to, at, actor }
workflow-gates:
  {}
  # fast 宏 Gate：fast.plan / fast.dev / fast.check；Full Artifact Gate 仍在 artifacts

# Phase 2.4 保留：feature-path（完整四级链）
# 兼容索引：首次绑定 Story 时可保留；权威 Story 链始终位于 story-metadata.yaml。
# candidate: explore 产出 Candidate 且未晋升时为 true（此时无法进入 task 阶段）
feature-path:
  level-1:
    id: FEAT-003
    name: 商城前台
  level-2:
    id: FEAT-003-01
    name: 商城会员
  level-3:
    id: FEAT-003-01-01
    name: 会员注册与认证
  story:
    id: STORY-003-01-01-01
    name: 商城会员注册
  candidate: false

# stories 是 Requirement 的 Story 权威索引；设计完成后长度必须为 1..N。
# 每个 Story 都有独立目录与 story-metadata.yaml。
stories:
  - id: STORY-003-01-01-01
    title: 商城会员注册
    status: pending
    path: 商城前台/商城会员/会员注册与认证/商城会员注册/
    domain:
      id: FEAT-003-01-01
      name: 会员注册与认证
    evidence-tier: standard
  - id: STORY-003-01-01-02
    title: 商城会员登录与会话
    status: pending
    path: 商城前台/商城会员/会员注册与认证/商城会员登录与会话/
    domain:
      id: FEAT-003-01-01
      name: 会员注册与认证
    evidence-tier: standard
  - id: STORY-003-01-02-01
    title: 会员资料维护
    status: pending
    path: 商城前台/商城会员/会员资料/会员资料维护/
    domain:
      id: FEAT-003-01-02
      name: 会员资料
    evidence-tier: standard
  - id: STORY-003-01-03-01
    title: 收货地址管理
    status: pending
    path: 商城前台/商城会员/收货地址/收货地址管理/
    domain:
      id: FEAT-003-01-03
      name: 收货地址
    evidence-tier: standard

# Phase 2.4 保留：仓库 Baseline / Result（DU 物化与完成时由 delivery-unit.js 写入）
# repository-baseline：DU materialize 时记录各仓起始 commit（可由 du sync-status 刷新）
# repository-result：DU completed 时记录各仓结果 commit
# 与 Submodule Pointer 的一致性由 converge 阶段 submodule-pointer-aligned 机检
repository-baseline:
  {}
  # backend: { commit: abc111 }
repository-result:
  {}
  # backend: { commit: abc999 }

# Phase 1.5 保留：artifacts 段（Gate Result 持久化）
# 仅存储 Requirement 级产物 Gate（exploration / requirement-spec / requirement-design / convergence）。
# Story 级产物 Gate 存储在对应 Story 目录的 story-metadata.yaml.artifacts。
# GateRepository 用 setIn 按需创建（不预填，避免模板臃肿）。
# Machine Gate 记录字段：status / checked-at / validator / artifact-hash / rules-hash / issues / warnings
