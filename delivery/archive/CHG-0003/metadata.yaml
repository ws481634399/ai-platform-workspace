    name: 骨架与基础能力
  story:
    id: STORY-3
    name: 建立 Java 后端微服务工程基线
  candidate: false

# Phase 2.4 新增：仓库 Baseline / Result（DU 物化与完成时由 delivery-unit.js 写入）
