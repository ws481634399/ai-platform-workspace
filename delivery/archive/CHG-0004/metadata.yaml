# OpenSpec Change Metadata
#
# 版本: v2（Phase 2.4 Multi-Repository Delivery）
# 类型: Change Metadata（SDD 生命周期载体元信息）
#
# 由 ChangeModel.runChangeCreate 生成（sdd-explore 内部调用）。
# v2 增量：schema-version / feature-path / repository-baseline / repository-result
# 兼容规则：schema-version 缺失视为 v1（features 扁平表 → feature-path 未绑定）；
#          旧 Change 仅在被显式操作（bind-feature-path / du materialize）时升级为 v2。
# 后续 status/archive 由 Document API 改写（保留注释）。

schema-version: 2 # 1 = 旧格式（仅 features 扁平表）；2 = 本格式

id: "CHG-0004" # CHG-XXXX，创建时填
title: "建立前端基础工程基线（mall-web 与 mall-admin）" # 简短标题
summary: "一次性建立 mall-web 商城端与 mall-admin 后台端两个 Vue3 + TS + Vite 前端应用的统一工程基线（M0，P0）" # 一句话摘要（可选）
status: archived # 见 Lifecycle State（change-lifecycle.md §4）：created/exploring/specified/designed/tasked/developing/testing/completed/archived
requirement: "REQ-M0-002" # 需求来源 REQ-XXX（sdd-explore 记录，对齐 requirement.md front-matter.id）
created-at: "2026-09-01T15:32:54.586Z" # ISO8601，创建时填
updated-at: "2026-09-02T14:28:46.723Z" # ISO8601，每次状态变更更新
features:
  - MOD-1
  - FEAT-3
  - FEAT-3-01
  - STORY-4
repositories:
  # 影响的仓库 id 列表（对应 .sdd/repositories.yaml，可空）
  # - backend
related-change: "" # 关联的历史 CHG-XXXX（需求复用 archived Change 时记录，可空）

# Phase 4.1 轻量化：Evidence 分档（gate-validator 按档位跳过 skip-tier 命中的 machine-checks）
# light    — 单仓、无接口变更的小改动：免 DU/多仓/逐 commit 映射等重仪式（openspec change tier <chg> light）
# standard — 缺省档，完整 Evidence（不改此字段即 standard）
# strict   — 跨仓/核心链路/安全变更：完整 Evidence + 全量机检
evidence-tier: standard

# Phase 2.4 新增：feature-path（完整四级链，权威字段；STORY 目录物化是其投影）
# 约束：CHG ↔ Story = 1:1；树唯一权威源是 product/feature-tree.yaml，此处为"引用不是副本"
# candidate: explore 产出 Candidate 且未晋升时为 true（此时无法进入 task 阶段）
feature-path:
  level-1:
    id: MOD-1
    name: 工程基础
  level-2:
    id: FEAT-3
    name: 前端工程基线
  level-3:
    id: FEAT-3-01
    name: 前端应用骨架
  story:
    id: STORY-4
    name: 建立前端基础工程基线（mall-web 与 mall-admin）
  candidate: false

# Phase 2.4 新增：仓库 Baseline / Result（DU 物化与完成时由 delivery-unit.js 写入）
# repository-baseline：DU materialize 时记录各仓起始 commit（可由 du sync-status 刷新）
# repository-result：DU completed 时记录各仓结果 commit
# 与 Submodule Pointer 的一致性由 converge 阶段 submodule-pointer-aligned 机检
repository-baseline:
  repo-2:
    commit: 122fca90178fb227f5d4166b8474a67577db979f
repository-result:
  repo-2:
    commit: 677133f17186cdcca4c5afa302cd07ed2ac7435e

