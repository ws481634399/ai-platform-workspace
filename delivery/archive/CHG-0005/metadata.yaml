# OpenSpec Change Metadata
#
# 版本: v3（Phase 4.2 Three-Tier Spec Delivery）
# 类型: Change Metadata（SDD 生命周期载体元信息）
#
# 由 ChangeModel.runChangeCreate 生成（sdd-explore 内部调用）。
# v2 增量：schema-version / feature-path / repository-baseline / repository-result
# v3 增量：stories 列表（Change 1:N Story 权威索引）
# 兼容规则：schema-version 缺失 = v1；= 2 旧格式（CHG↔Story 1:1 平铺）；= 3 新格式（含 stories）
#          旧 Change 仅在被显式操作（bind-feature-path / split-story / upgrade）时升 v3
# 后续 status/archive 由 Document API 改写（保留注释）。

schema-version: 4 # 1=v1(仅 features 扁平表)；2=v2(Phase 2.4-4.1，单 Story 平铺)；3=v3(本格式，1:N Stories)

id: "CHG-0005" # CHG-XXXX，创建时填
title: "建立 AI Service Python 工程基线（FastAPI + uv）" # 简短标题
summary: "" # 一句话摘要（可选）
status: archived # 见 Lifecycle State（change-lifecycle.md §4）：created/exploring/specified/designed/story-splitting/tasked/developing/testing/completed/archived
requirement: "REQ-M0-003" # 需求来源 REQ-XXX（sdd-explore 记录，对齐 requirement.md front-matter.id）
created-at: "2026-09-04T13:49:53.873Z" # ISO8601，创建时填
updated-at: "2026-09-07T13:33:32.545Z" # ISO8601，每次状态变更更新
features:
  - MOD-1
  - FEAT-1-02
  - FEAT-1-02-01
  - STORY-1-02-01-01
repositories:
  # 影响的仓库 id 列表（对应 .sdd/repositories.yaml，可空）
  # - backend
related-change: "" # 关联的历史 CHG-XXXX（需求复用 archived Change 时记录，可空）

# Phase 4.1 轻量化：Evidence 分档（gate-validator 按档位跳过 skip-tier 命中的 machine-checks）
# light    — 单仓、无接口变更的小改动：免 DU/多仓/逐 commit 映射等重仪式（openspec change tier <chg> light）
# standard — 缺省档，完整 Evidence（不改此字段即 standard）
# strict   — 跨仓/核心链路/安全变更：完整 Evidence + 全量机检
evidence-tier: standard

# Phase 2.4 保留：feature-path（完整四级链）
# v3 语义变更：仅 inline 单 Story 场景填（兼容 v2 语义）；多 Story 场景**不填**，
# 权威 Story 链以 stories[*].path → story-metadata.yaml.feature-path 为准。
# candidate: explore 产出 Candidate 且未晋升时为 true（此时无法进入 task 阶段）
feature-path:
  level-1:
    id: MOD-1
    name: 工程基础
  level-2:
    id: FEAT-1-02
    name: AI 工程基线
  level-3:
    id: FEAT-1-02-01
    name: AI 应用骨架
  story:
    id: STORY-1-02-01-01
    name: 建立 Python AI Service 工程基线
  candidate: false

# Phase 4.2 新增：stories 列表（Change 1:N Story 权威索引）
# - 单 Story inline 模式：长度 = 1 且 inline=true（CHG 根目录同时是 Story 目录）
# - 多 Story 三级模式：每条路径指向 stories/<STORY-ID>/ 目录，其中含 story-metadata.yaml
stories:
  - id: STORY-1-02-01-01
    title: 建立 Python AI Service 工程基线
    inline: true
    status: pending
    path: ./
    evidence-tier: standard
    domain:
      id: FEAT-1-02-01
      name: AI 应用骨架

# Phase 2.4 保留：仓库 Baseline / Result（DU 物化与完成时由 delivery-unit.js 写入）
# repository-baseline：DU materialize 时记录各仓起始 commit（可由 du sync-status 刷新）
# repository-result：DU completed 时记录各仓结果 commit
# 与 Submodule Pointer 的一致性由 converge 阶段 submodule-pointer-aligned 机检
