# OpenSpec Context Rules Configuration
#
# 版本: v0.3
# 类型: AI Context Loading Rules
#
# 定义 AI Agent 在不同 SDD 阶段
# 应该读取的 Workspace 上下文。
#
# v0.3 说明：
# - 条目为结构化格式 { path, mode }，mode ∈ inline | outline | skip
# - change-artifacts: 该阶段注入 Change Artifact 清单
# - limits: 注入预算
# - repos.<repoId>.read: 绑定 DU 时激活的 per-repo 规则段


# 不同开发阶段上下文规则

version: 0.3

stages:


  # 探索阶段
  #
  # 目标：
  # - 理解需求
  # - 分析业务上下文
  # - 识别影响范围

  explore:

    read:

      - path: standards/
        mode: inline

      - path: product/
        mode: inline



  # 产品规格阶段
  #
  # 目标：
  # - 生成产品规格
  # - 定义验收标准
  # - 明确业务规则

  prd:

    read:

      - path: product/
        mode: inline

      - path: delivery/
        mode: inline



  # 设计阶段
  #
  # 目标：
  # - 生成技术设计
  # - 分析架构影响
  # - 评估风险

  design:

    read:

      - path: standards/
        mode: inline

      - path: product/
        mode: inline

      - path: implementation/
        mode: inline



  # 任务拆分阶段
  #
  # 目标：
  # - 拆分设计为可执行任务
  # - 明确修改范围
  # - 定义验证方式

  task:

    read:

      - path: delivery/
        mode: inline



  # 开发阶段
  #
  # 目标：
  # - 执行 Task
  # - 修改实现代码
  # - 遵循工程规范

  dev:

    read:

      - path: delivery/
        mode: inline

      - path: implementation/
        mode: inline



  # 测试阶段
  #
  # 目标：
  # - 验证实现
  # - 生成 Evidence
  # - 检查质量

  test:

    read:

      - path: delivery/
        mode: inline

      - path: implementation/
        mode: inline



  # 评审阶段
  #
  # 目标：
  # - 跨仓一致性检查
  # - Evidence 完整性
  # - 汇聚准备

  review:

    read:

      - path: standards/
        mode: outline

      - path: implementation/
        mode: outline

    change-artifacts:
      - requirement.md
      - prd.md
      - design.md


  # 知识沉淀阶段
  #
  # 目标：
  # - 逆向分析
  # - 更新项目知识
  # - 沉淀经验

  converge:

    read:

      - path: delivery/
        mode: inline

      - path: implementation/
        mode: inline
