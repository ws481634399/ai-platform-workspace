# OpenSpec Repository Configuration
#
# 版本: v0.1
# 类型: Repository Metadata
#
# 用于描述当前 Workspace 关联的代码仓库。

# 仓库模式
#
# single:
#   单仓库项目
#
# multi:
#   多仓库项目

mode: multi

# 仓库列表
#
# single模式:
#   通常只有一个repository
#
# multi模式:
#   可以配置多个repository

repositories:
  # OpenSpec/SDD 工作区仓：管理 delivery/standards/product/skills，不承载实现资产。
  # implementation/ 整体受 .gitignore 隔离，不将下方独立仓纳入本仓跟踪。
  - id: repo-workspace
    alias: WS
    path: .
    kind: git
    remote: https://github.com/ws481634399/ai-platform-workspace.git
# 后端 Monorepo（Maven 根=仓库根），远程 github.com/ws481634399/ai-platform-backend.git
  - id: repo-1
    path: implementation/ai-platform-backend 
    kind: git
    remote: https://github.com/ws481634399/ai-platform-backend.git
  # 前端仓库（CHG-0004 explore 阶段启用，2026-09-01）：
  # 本地 implementation/ai-platform-frontend（git clone 自远程 github.com/ws481634399/ai-platform-frontend-web.git，
  # 远程当前为空仓库，M0 工程基线将在 dev 阶段初始化并推送）；
  # implementation/ 整体在工作区 .gitignore 中，仓库独立管理不入工作区版本库
  - id: repo-2
    path: implementation/ai-platform-frontend
    kind: git
    remote: https://github.com/ws481634399/ai-platform-frontend-web.git
  # AI Service 独立仓库（CHG-0005 explore 阶段启用，2026-09-04）：
  # 本地 implementation/ai-platform-ai-service（git clone 自远程 github.com/ws481634399/ai-platform-AIService.git，
  # 远程当前为空仓库，M0 工程基线将在 dev 阶段初始化并推送）；
  # implementation/ 整体在工作区 .gitignore 中，仓库独立管理不入工作区版本库
  - id: repo-3
    path: implementation/ai-platform-ai-service
    kind: git
    remote: https://github.com/ws481634399/ai-platform-AIService.git
  # 本地基础设施独立仓（CHG-0006 完成后纠偏）：
  # 统一管理 deploy/ 与仓库侧 delivery，不归属于 Workspace 或 Frontend 仓。
  - id: repo-4
    path: implementation/ai-platform-infrastructure
    kind: git
    remote: https://github.com/ws481634399/ai-platform-infrastructure.git
