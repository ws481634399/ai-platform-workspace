# OpenSpec Repository Configuration
#
# 版本: v0.1
# 类型: Repository Metadata
#
# 用于描述当前 Workspace 关联的代码仓库。

# 仓库模式
#
# single:
#   单仓库项目
#
# multi:
#   多仓库项目

mode: multi

# 仓库列表
#
# single模式:
#   通常只有一个repository
#
# multi模式:
#   可以配置多个repository

repositories:
  - id: repo-1
    path: ../ai-platform-backend # 后端 Monorepo（Maven 根=仓库根），远程 github.com/ws481634399/ai-platform-backend.git，见 CHG-0001 技术决策 3（2026-08-28 修订）
  - id: repo-2
    path: ../ai-platform-frontend # 前端仓库预留（M1 建立时启用）
